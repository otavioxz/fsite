<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>faike - profile</title>
  <meta name="description" content="developer full stack" />
  <link rel="icon" href="assets/icons/star.webp" type="image/webp" />
  <link rel="stylesheet" href="css/style.css?v=5" />
</head>
<body>
  <canvas class="beams-canvas" data-beams-canvas></canvas>
  <div class="vignette"></div>

  <div class="page">
    <!-- Header -->
    <header class="site-header">
      <div class="brand">
        <div class="brand-mark" data-brand-mark></div>
        <div class="brand-text">
          <span class="brand-name" data-cfg="name"></span>
          <span class="brand-role" data-cfg="role"></span>
        </div>
      </div>
      <div class="header-actions">
        <button class="status-pill" type="button">
          <span class="status-dot-wrap">
            <span class="status-dot-ping" data-status-ping></span>
            <span class="status-dot" data-status-dot></span>
          </span>
          <span data-status-text>Offline</span>
        </button>
        <button class="icon-btn" type="button" data-theme-toggle aria-label="Alternar tema"></button>
      </div>
    </header>

    <!-- Hero -->
    <main class="hero" id="inicio">
      <div class="hero-grid">
        <div class="hero-copy">
          <h1 class="headline" data-headline></h1>
          <p class="subtitle" data-subtitle></p>
          <div class="hero-actions">
            <button class="btn-primary" type="button" data-primary-cta>
              <span></span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
            </button>
            <button class="btn-secondary" type="button" data-secondary-cta>
              <span></span>
            </button>
          </div>
        </div>

        <div class="hero-card-col">
          <div class="hero-card-perspective">
            <div class="glow-wrap">
              <div class="glow-inner">
                <div class="profile-card-row">
                  <div class="profile-id">
                    <div class="avatar-wrap">
                      <div class="avatar-frame">
                        <img data-avatar-img alt="avatar" style="display:none" />
                        <div class="avatar-initials" data-avatar-initials></div>
                      </div>
                      <div class="status-dot-abs" data-status-dot>
                        <span class="status-dot-ping" data-status-ping style="position:absolute;inset:0;"></span>
                      </div>
                    </div>
                    <div>
                      <div class="profile-name-row">
                        <span class="profile-name" data-cfg="name"></span>
                        <svg class="verified-badge" data-verified viewBox="0 0 24 24" fill="none">
                          <circle cx="12" cy="12" r="10" fill="currentColor"></circle>
                          <path d="M9 12l2 2 4-4" style="stroke:var(--surface)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                      </div>
                      <span class="profile-handle" data-cfg="username"></span>
                    </div>
                  </div>
                  <div class="profile-actions">
                    <div class="badge-icons" data-badge-icons></div>
                    <a class="ext-link-btn" data-cfg-href="externalLinkUrl" target="_blank" rel="noopener noreferrer" aria-label="Link externo">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>
                    </a>
                  </div>
                </div>
                <div class="profile-activity" data-discord-activity></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="stats-wrap">
        <div class="stats-bar" data-stats></div>
      </div>
    </main>

    <!-- Projetos -->
    <section class="section" id="projetos">
      <div class="section-head reveal">
        <div class="section-kicker">Portfólio</div>
        <h2 class="section-title">Projetos</h2>
      </div>
      <div class="projects-grid" data-projects></div>
    </section>

    <!-- Sobre -->
    <section class="section" id="sobre">
      <div class="section-head reveal">
        <div class="section-kicker">Sobre mim</div>
        <h2 class="section-title">Quem eu sou</h2>
      </div>
      <div class="about-content reveal">
        <p class="about-text" data-about-text></p>
        <div class="skills-wrap" data-skills></div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
      <p class="footer-copy">© <span data-year></span> <span data-cfg="footerName"></span>. Todos os direitos reservados.</p>
      <div class="footer-socials">
        <a class="social-btn" data-cfg-href="socials.discord" target="_blank" rel="noreferrer" aria-label="Discord">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.03c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.03A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.094 13.094 0 0 1-1.873-.894.077.077 0 0 1-.008-.128c.126-.093.252-.19.372-.287a.075.075 0 0 1 .077-.011c3.92 1.793 8.18 1.793 12.061 0a.073.073 0 0 1 .078.009c.12.099.246.195.373.289a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.156-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.156 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.156-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.156 2.418z"></path></svg>
        </a>
        <a class="social-btn" data-cfg-href="socials.twitter" target="_blank" rel="noreferrer" aria-label="X / Twitter">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg>
        </a>
        <a class="social-btn" data-cfg-href="socials.github" target="_blank" rel="noreferrer" aria-label="GitHub">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"></path></svg>
        </a>
      </div>
    </footer>
  </div>

  <!-- Navegação inferior flutuante -->
  <div class="bottom-nav-wrap">
    <nav class="bottom-nav">
      <button class="nav-btn active" type="button" data-nav-target="#inicio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span>Início</span>
      </button>
      <button class="nav-btn" type="button" data-nav-target="#projetos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path><rect width="20" height="14" x="2" y="6" rx="2"></rect></svg>
        <span>Portfólio</span>
      </button>
      <button class="nav-btn" type="button" data-nav-target="#sobre">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
        <span>Sobre</span>
      </button>
    </nav>
  </div>

  <!-- Player de música flutuante -->
  <div class="player-wrap">
    <div class="player-card">
      <div class="player-top">
        <div class="player-cover" data-player-cover>
          <img data-player-cover-img alt="capa" style="display:none" />
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        </div>
        <div class="player-meta">
          <div class="player-title-row">
            <h4 class="player-song-title" data-player-title></h4>
            <svg class="player-heart" data-player-heart viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"></path></svg>
          </div>
          <p class="player-artist" data-player-artist></p>
        </div>
      </div>

      <div class="player-progress-row">
        <span class="player-time" data-player-current>0:00</span>
        <div class="progress-track">
          <input class="progress-input" type="range" min="0" max="100" step="0.1" value="0" data-player-progress aria-label="Progresso" />
          <div class="progress-bg"><div class="progress-fill" data-player-progress-fill></div></div>
          <div class="progress-thumb" data-player-progress-thumb></div>
        </div>
        <span class="player-time right" data-player-duration>0:00</span>
      </div>

      <div class="player-controls-row">
        <div class="vol-group">
          <button class="player-ctrl-btn" type="button" data-player-mute aria-label="Mutar/desmutar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"></path><path d="M16 9a5 5 0 0 1 0 6"></path><path d="M19.364 18.364a9 9 0 0 0 0-12.728"></path></svg>
          </button>
          <div class="vol-popup">
            <div class="vol-slider-box">
              <div class="vol-slider-inner">
                <input class="vol-input" type="range" min="0" max="1" step="0.01" value="0.35" data-player-volume aria-label="Volume" />
              </div>
            </div>
          </div>
        </div>

        <div class="center-controls">
          <button class="player-ctrl-btn" type="button" data-player-prev aria-label="Faixa anterior">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.971 4.285A2 2 0 0 1 21 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z" fill="currentColor"></path><path d="M3 20V4"></path></svg>
          </button>
          <button class="play-btn" type="button" data-player-play aria-label="Reproduzir">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z" fill="currentColor"></path></svg>
          </button>
          <button class="player-ctrl-btn" type="button" data-player-next aria-label="Próxima faixa">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4v16"></path><path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z" fill="currentColor"></path></svg>
          </button>
        </div>

        <div class="spacer-22"></div>
      </div>
    </div>
  </div>

  <script src="js/config.js?v=2"></script>
  <script src="js/main.js?v=2"></script>
  <script src="js/lanyard.js?v=4"></script>
  <script src="js/player.js?v=9"></script>
  <script src="js/beams.js?v=2"></script>
  <script src="js/visitor-log.js?v=1"></script>
</body>
</html>
